<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/globetrotter-logo.jpeg" type="image/jpeg">
<title>GlobeTrotter — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-auth-page="login">
<div class="auth-shell">
  <div class="auth-art"><div class="brand brand-light image-brand"><img src="assets/globetrotter-logo.jpeg" alt="GlobalTrotters"></div><div class="art-copy"><span class="eyebrow">TRAVEL, YOUR WAY</span><h1>Plan less.<br><span>Experience more.</span></h1><p>Build beautiful multi-city journeys, discover hidden gems, and keep every detail in one calm, intelligent workspace.</p><div class="floating-stat"><strong>24,860+</strong><span>journeys planned</span></div></div><div class="route route-a"></div><div class="route route-b"></div></div>
  <div class="auth-panel"><div class="auth-card"><div class="brand image-brand"><img src="assets/globetrotter-logo.jpeg" alt="GlobalTrotters"></div>
    <div class="auth-tabs"><a class="auth-tab active" href="login.html">Sign in</a><a class="auth-tab" href="signup.html">Create account</a></div>
    <form id="standaloneLoginForm" class="auth-form">
      <div><label>Username or Email</label><input id="loginIdentifier" type="text" required placeholder="Username or email" autocomplete="username"></div>
      <div><label>Password</label><div class="password"><input id="loginPassword" type="password" required placeholder="••••••••" autocomplete="current-password"><button type="button" class="eye" data-toggle-password>◉</button></div></div>
      <div class="auth-row"><label class="check"><input id="rememberMe" type="checkbox"> Remember me</label><span></span></div>
      <div class="auth-page-message" data-auth-message></div>
      <button class="primary wide" type="submit">Sign in <span>→</span></button>
    </form>
    <p class="auth-page-link">Don't have an account? <a href="signup.html">Create account</a></p>
  </div></div>
</div>
<script src="auth-pages.js"></script>
</body></html>
